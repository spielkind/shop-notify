version: 2
updates:
  # New versions are only proposed after a cooldown of 7 days (supply-chain safety).
  # Python dependencies: one grouped pull request per week; major updates separately
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        update-types: [minor, patch]
      python-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: build
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: ci
    labels: [dependencies, github_actions]

  # Web UI dependencies (only needed to build it); one grouped pull request per week
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # Packages that only work in matching versions are updated together, also for
      # major versions
      vitest:
        patterns: [vitest, "@vitest/*"]
      svelte:
        patterns:
          - svelte
          - "@sveltejs/*"
          - svelte-check
          - prettier-plugin-svelte
          - eslint-plugin-svelte
      eslint:
        patterns: [eslint, "@eslint/*", typescript-eslint, eslint-config-prettier]
      ui:
        update-types: [minor, patch]
      ui-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # SvelteKit 3 needs TypeScript 6
      - dependency-name: typescript
        versions: [">=7"]
    commit-message:
      prefix: build
    labels: [dependencies]

  # Base images of the poller and the web UI
  - package-ecosystem: docker
    directories: [/, /ui]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    labels: [dependencies, docker]

  # Caddy in compose.yaml
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    labels: [dependencies, docker]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      pre-commit:
        patterns: ["*"]
    commit-message:
      prefix: chore
    labels: [dependencies]
